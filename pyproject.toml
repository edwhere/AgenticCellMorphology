[project]
name = "agenticcellmorph"
version = "0.1.0"
description = "Performns statistical and predictive analysis on cell morphology tables."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "matplotlib>=3.11.2",
    "pandas>=3.1.1",
    "pydantic-ai>=2.69.0",
    "scikit-learn>=1.9.1",
    "shap>=0.54.1",
]

[project.scripts]
agenticcellmorph = "agenticcellmorph:main"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["tests"]
